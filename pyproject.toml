[project]
name = "gemma-labeling"
version = "0.1.0"
description = "Gemma 4 E2B booru-style constrained labeling PoC"
readme = "README.md"
authors = [
    { name = "Nominy", email = "sapkovich.vladislav@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.0.1",
    "fastapi==0.109.2",
    "httpx==0.28.1",
    "pillow==10.4.0",
    "python-dotenv==1.1.1",
    "pydantic==2.11.7",
    "python-multipart==0.0.9",
    "pyyaml==6.0.2",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "transformers==5.5.4",
    "uvicorn==0.27.1",
]

[project.scripts]
gemma-labeling = "gemma_labeling.main:cli"

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
